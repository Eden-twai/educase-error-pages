<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>找不到頁面｜教育百寶箱</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --surface: #ffffff;
      --text: #437f81;
      --muted: #6d6f7f;
      --line: #e1e2eb;
      --primary: #437f81;
      --primary-dark: #2a5152;
      --primary-soft: #ececf6;
      --shell-dark: rgba(29, 36, 42, 0.9);
      --shell-dark-line: rgba(255, 255, 255, 0.12);
      --max-width: 1160px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 24%, rgba(80, 83, 147, 0.07), transparent 25rem),
        linear-gradient(180deg, #fdfdff 0%, var(--bg) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(calc(100% - 48px), var(--max-width));
      margin-inline: auto;
    }

    .site-header {
      background-color: var(--shell-dark);
      border-bottom: 1px solid var(--shell-dark-line);
    }

    .header-inner {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
    }

    .brand-mark {
      position: relative;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 11px;
      background: linear-gradient(145deg, #8588b6, var(--primary));
      box-shadow: 0 7px 18px rgba(0, 0, 0, .16);
      overflow: hidden;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, .92);
      border-radius: 3px;
    }

    .brand-mark::before {
      width: 24px;
      height: 7px;
      left: 9px;
      top: 9px;
    }

    .brand-mark::after {
      width: 7px;
      height: 18px;
      left: 9px;
      top: 17px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-text strong {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .brand-text small {
      margin-top: 4px;
      color: rgba(255, 255, 255, .78);
      font-size: 11px;
      letter-spacing: .14em;
    }

    .header-link {
      color: rgba(255, 255, 255, .92);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .header-link:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 64px 0 80px;
    }

    .error-content {
      width: min(100%, 760px);
      margin-inline: auto;
      text-align: center;
    }

    .status-visual {
      width: 96px;
      height: 96px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--primary-soft);
      border: 1px solid rgba(80, 83, 147, .08);
    }

    .status-visual svg {
      width: 64px;
      height: 64px;
      display: block;
      color: var(--primary);
    }

    .status-code {
      margin: 0;
      color: var(--primary);
      font-size: clamp(76px, 10vw, 112px);
      font-weight: 800;
      line-height: .95;
      letter-spacing: -.065em;
    }

    .eyebrow {
      margin: 18px 0 12px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    .error-content h1 {
      margin: 0;
      font-size: clamp(34px, 4.6vw, 52px);
      line-height: 1.2;
      letter-spacing: -.03em;
    }

    .description {
      margin: 22px auto 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.9;
    }

    .actions {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .button {
      min-height: 48px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 8px 20px rgba(80, 83, 147, .18);
    }

    .button-primary:hover {
      background: var(--primary-dark);
    }

    .button-secondary {
      color: var(--primary-dark);
      background: var(--surface);
      border-color: var(--line);
    }

    .button-secondary:hover {
      border-color: #c7c8d8;
      background: #fdfdff;
    }

    .button:focus-visible,
    .header-link:focus-visible,
    .brand:focus-visible,
    .footer-links a:focus-visible {
      outline: 3px solid rgba(80, 83, 147, .24);
      outline-offset: 4px;
    }

    .help-text {
      margin: 24px 0 0;
      color: #818391;
      font-size: 14px;
      line-height: 1.7;
    }

    .site-footer {
      background-color: var(--shell-dark);
      border-top: 1px solid var(--shell-dark-line);
    }

    .footer-inner {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: rgba(255, 255, 255, .76);
      font-size: 14px;
      letter-spacing: 0.225em;
    }

    .footer-copy {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    .footer-copy strong {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, .82);
      font-size: 12px;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 620px) {
      .container {
        width: min(calc(100% - 32px), var(--max-width));
      }

      .header-inner {
        min-height: 72px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }

      .brand-text strong {
        font-size: 15px;
      }

      .brand-text small {
        font-size: 10px;
      }

      .header-link {
        font-size: 13px;
      }

      .error-page {
        padding: 46px 0 58px;
      }

      .description {
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .footer-inner {
        padding: 24px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .footer-copy {
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/welcome/" aria-label="教育百寶箱首頁">
          <!-- <span class="brand-mark" aria-hidden="true"></span> -->
          <span class="brand-text">
            <strong>教育百寶箱</strong>
          </span>
        </a>
        <a class="header-link" href="/welcome/">回到首頁</a>
      </div>
    </header>

    <main class="error-page">
      <section class="container error-content" aria-labelledby="error-title">
        <div class="status-visual" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img" aria-label="找不到頁面圖示">
            <path fill="currentColor"
              d="M10 17a5 5 0 0 1 5-5h13l5 6h16a5 5 0 0 1 5 5v24a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5V17Z" opacity=".18" />
            <path fill="currentColor" d="M12 25h40v21a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V25Z" opacity=".32" />
            <path fill="currentColor"
              d="M20 31h24a2 2 0 1 1 0 4H20a2 2 0 1 1 0-4Zm0 8h16a2 2 0 1 1 0 4H20a2 2 0 1 1 0-4Z" />
          </svg>
        </div>
        <p class="status-code">404</p>
        <h1 id="error-title">找不到這個頁面</h1>
        <p class="eyebrow">PAGE NOT FOUND</p>
        <p class="description">您瀏覽的頁面可能已移動、刪除，或網址輸入有誤。<br>您可以回到教育百寶箱首頁，繼續使用相關服務。</p>
        <div class="actions">
          <a class="button button-primary" href="/welcome/">回到首頁</a>
        </div>
        <p class="help-text">若持續發生問題，請聯絡教育百寶箱服務人員。</p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-copy">
          <span>©2026 <a href="https://www.kh.edu.tw/" target="_blank">高雄市政府教育局</a></span>
        </div>
      </div>
    </footer>
  </div>
</body>

</html>
