<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>網站維護中｜教育百寶箱</title>
  <style>
    :root {
      --bg: #f6f8f7;
      --surface: #ffffff;
      --text: #437f81;
      --muted: #6d6f7f;
      --line: #e1e2eb;
      --primary: #437f81;
      --primary-dark: #2a5152;
      --primary-soft: #ececf6;
      --secondary: #efbd68;
      --secondary-soft: #fff3dc;
      --coral: #e88973;
      --coral-soft: #fbe9e4;
      --shell-dark: rgba(29, 36, 42, 0.9);
      --shell-dark-line: rgba(255, 255, 255, 0.12);
      --max-width: 1160px;
      --shadow: 0 22px 60px rgba(46, 79, 80, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 20%, rgba(239, 189, 104, .12), transparent 18rem),
        radial-gradient(circle at 82% 72%, rgba(67, 127, 129, .11), transparent 21rem),
        linear-gradient(180deg, #fbfcfc 0%, var(--bg) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hover-link:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .site-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(calc(100% - 48px), var(--max-width));
      margin-inline: auto;
    }

    .site-header {
      background-color: var(--shell-dark);
      border-bottom: 1px solid var(--shell-dark-line);
    }

    .header-inner {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .header-link {
      color: rgba(255, 255, 255, .92);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .header-link:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .maintenance-page {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 56px 0 64px;
    }

    .maintenance-page::before,
    .maintenance-page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .maintenance-card {
      position: relative;
      width: min(100%, 760px);
      margin-inline: auto;
      padding: 44px 52px 42px;
      text-align: center;
      background: rgba(255, 255, 255, .94);
      border: 1px solid rgba(67, 127, 129, .12);
      border-radius: 3px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .maintenance-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: linear-gradient(90deg, var(--primary) 0 44%, var(--secondary) 44% 72%, var(--coral) 72% 100%);
    }

    .spark {
      position: absolute;
      display: block;
      pointer-events: none;
    }

    .spark--one {
      width: 14px;
      height: 14px;
      left: 42px;
      top: 62px;
      border: 3px solid var(--secondary);
      border-radius: 50%;
    }

    .spark--two {
      width: 12px;
      height: 12px;
      right: 54px;
      top: 88px;
      background: var(--coral);
      border-radius: 3px;
      transform: rotate(45deg);
      opacity: .8;
    }

    .spark--three {
      width: 34px;
      height: 5px;
      right: 62px;
      bottom: 56px;
      border-radius: 999px;
      background: rgba(67, 127, 129, .18);
      transform: rotate(-24deg);
    }

    .status-visual {
      width: 104px;
      height: 104px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--primary);
      background:
        radial-gradient(circle at 34% 28%, #ffffff 0 8%, transparent 9%),
        var(--primary-soft);
      border: 1px solid rgba(67, 127, 129, .12);
      box-shadow: 0 10px 26px rgba(67, 127, 129, .10);
    }

    .status-visual svg {
      width: 66px;
      height: 66px;
      display: block;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(34px, 4.8vw, 40px);
      line-height: 1.5;
      letter-spacing: .02em;
    }

    .description {
      max-width: 620px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.9;
    }

    .maintenance-window {
      max-width: 560px;
      margin: 28px auto 0;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text);
      background: linear-gradient(135deg, var(--primary), var(--primary));
      /* border: 1px solid rgba(239, 189, 104, .36); */
      border-radius: 3px;
    }

    .maintenance-window__icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      color: #ffffff;
      /* background: rgba(255, 255, 255, .72); */
      border-radius: 10px;
    }

    .maintenance-window__icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .maintenance-window__text {
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 12px;
      text-align: left;
    }

    .maintenance-window__label {
      color: #fff;
      font-size: 16px;
      letter-spacing: .06em;
    }

    .maintenance-window__time {
      color: #ffffff;
      font-size: 16px;
      letter-spacing: .05em;
    }

    .actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }

    .button {
      min-height: 48px;
      padding: 0 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      /* color: #fff; */
      /* background: var(--primary); */
      /* border: 1px solid var(--primary); */
      border-radius: 3px;
      /* box-shadow: 0 8px 20px rgba(67, 127, 129, .18); */
      font-size: 15px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .button:hover {
      color: var(--primary-dark);
      /* background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(67, 127, 129, .24); */
    }

    .button svg {
      width: 17px;
      height: 17px;
    }

    .help-text {
      margin: 20px 0 0;
      color: #7a8889;
      font-size: 14px;
      line-height: 1.7;
    }

    .site-footer {
      background-color: var(--shell-dark);
      border-top: 1px solid var(--shell-dark-line);
    }

    .footer-inner {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, .76);
      font-size: 14px;
      letter-spacing: .14em;
    }

    .footer-inner a {
      color: rgba(255, 255, 255, .88);
    }

    .button:focus-visible,
    .header-link:focus-visible,
    .brand:focus-visible,
    .footer-inner a:focus-visible {
      outline: 3px solid rgba(67, 127, 129, .30);
      outline-offset: 4px;
    }

    @media (max-width: 620px) {
      .container {
        width: min(calc(100% - 32px), var(--max-width));
      }

      .header-inner {
        min-height: 72px;
      }

      .brand {
        font-size: 15px;
      }

      .header-link {
        font-size: 13px;
      }

      .maintenance-page {
        padding: 38px 0 46px;
      }

      .maintenance-card {
        padding: 36px 22px 32px;
        border-radius: 22px;
      }

      /* .spark--one { left: 20px; top: 48px; }
      .spark--two { right: 24px; top: 74px; }
      .spark--three { display: none; } */

      .status-visual {
        width: 94px;
        height: 94px;
      }

      .status-visual svg {
        width: 60px;
        height: 60px;
      }

      .description {
        font-size: 16px;
      }

      .maintenance-window {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 16px;
      }

      .maintenance-window__text {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .maintenance-window__time {
        font-size: 15px;
      }

      .button {
        width: 100%;
      }

      .footer-inner {
        min-height: 82px;
        font-size: 12px;
        letter-spacing: .08em;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand hover-link" href="https://educase.kh.edu.tw/welcome/" aria-label="教育百寶箱首頁"><img
            src="/logo_square.png" style="width:40px; margin-right:12px">教育百寶箱</a>
        <a class="header-link" href="https://educase.kh.edu.tw/welcome/">回到首頁</a>
      </div>
    </header>

    <main class="maintenance-page">
      <section class="container maintenance-card" aria-labelledby="maintenance-title">

        <div class="status-visual" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

              fill="currentColor" />
            <path
              d="M39.8439 37.6724L36.63 40.7706H7.8593C5.5838 40.7706 3.9255 38.8165 4.0026 36.7211C4.0797 34.6256 5.8281 32.8516 8.1292 32.8901H40.0239C39.6639 34.4842 39.5354 35.9626 39.8439 37.6724Z"
              fill="currentColor" />
          </svg>
        </div>
        <h1 id="maintenance-title">網站維護中</h1>
        <p class="eyebrow">SYSTEM MAINTENANCE</p>
        <p class="description">
          教育百寶箱目前正在進行系統維護作業，部分服務暫時無法使用。<br>
          造成不便，敬請見諒。
        </p>

        <!-- 部署前請將下方時間替換為實際預定維護時段 -->
        <div class="maintenance-window" aria-label="預定維護時間">
          <span class="maintenance-window__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M16 3v4M8 3v4M3 10h18"></path>
            </svg>
          </span>
          <span class="maintenance-window__text">
            <span class="maintenance-window__label">預定維護時間</span>
            <strong class="maintenance-window__time">YYYY/MM/DD（週X）HH:MM ～ HH:MM</strong>
          </span>
        </div>

        <div class="actions">
          <a class="button" href="https://educase.kh.edu.tw/welcome/">
            回到首頁
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"></path>
            </svg>
          </a>
        </div>

        <!-- <p class="help-text">系統恢復後即可正常使用教育百寶箱服務。</p> -->
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>©2026 <a href="https://www.kh.edu.tw/" class="hover-link" target="_blank"
            rel="noopener noreferrer">高雄市政府教育局</a></span>
      </div>
    </footer>
  </div>
</body>

</html>
